name: Admin.Events.SandsBytes
description: Runs external script to ship scan results to a FastAPI system after collection.
type: SERVER_EVENT

required_permissions:
  - EXECVE

parameters:
  - name: PythonScript
    description: |
      The Python script to run.
    default: /velociraptor/SandsBytesConnector/SandsBytesShipper.py

  - name: ArtifactsToWatch
    type: artifactset 
    description: List of artifacts to monitor
    artifact_type: CLIENT
    sources: TRUE
    default: |
      Windows.Detection.Amcache
      Windows.System.Pslist
      

  - name: TemporaryDirectory
    description: |
      The temporary directory to use for the script.
    default: /tmp

  - name: SandsBytesURL
    description: |
      The URL of the SandsBytes server.
    default: https://192.168.237.134/api
  - name: SandsBytesUsername
    description: |
      The username for the SandsBytes server.
    default: admin
  - name: SandsBytesPassword
    description: |
      The password for the SandsBytes server.
    default: Password@123
    
  - name: StartProcessingImmediately
    description: |
      Start the processing for the artifact automaticlly after submission to SandsBytes.
    default: True
    type: bool
    
   

sources:
  - query: |
       LET find_hostname(ClientId) = SELECT os_info.hostname as Hostname, labels as Labels FROM clients() WHERE client_id = ClientId
        
       LET Completions = SELECT *
         FROM watch_monitoring(artifact='System.Flow.Completion')
         -- Try to match ANY artifact in flow against ANY artifact in ClientArtifactsToWatch.
         -- Returns flows where there is at least one match in the completed flow.
         WHERE Flow.artifacts_with_results =~ join(array=ArtifactsToWatch.Artifact, sep="|")
      
      
       LET GetResultsFile(ClientId, FlowId, ArtifactName) = 
          SELECT 
            tempfile(
              extension=".json",
              remove_last=TRUE,
              data=serialize(
                format="json",
                item={
                  SELECT * FROM source(
                    client_id=ClientId,
                    flow_id=FlowId,
                    artifact=ArtifactName
                  )
                }
              )
            ) AS ResultsPath
          FROM scope()
          
      
       
       LET PostProcess(Hostname, ClientId, FlowId, ArtifactName, ResultsPath, Labels) =
         SELECT *
         FROM execve(argv=["python3", PythonScript, "-a", ArtifactName, "-f", ResultsPath, "-t", TemporaryDirectory, "-c", Hostname, "-s", SandsBytesURL, "-u", SandsBytesUsername, "-p", SandsBytesPassword, "-l", join(array=Labels, sep=","), "-ap" , StartProcessingImmediately],
                     -- Under normal circumstances length and line breaks are
                     -- irrelevant since we aren't reading the data back.
                     sep="\n",
                     length=99999999)


        -- 3. Execution Loop
        SELECT * FROM foreach(
          row=Completions,
          query={
             SELECT * FROM foreach(
               row={
                  SELECT 
                    _value AS TargetArtifact
                  FROM foreach(row=Flow.artifacts_with_results)
                  WHERE TargetArtifact =~ join(array=ArtifactsToWatch.Artifact, sep="|")
               },
               query={
                  SELECT 
                     TargetArtifact,
                     PostProcess(
                        Hostname=find_hostname(ClientId=ClientId)[0].Hostname,
                        ClientId=ClientId,
                        FlowId=FlowId,
                        ArtifactName=TargetArtifact,
                        ResultsPath=GetResultsFile(ClientId=ClientId, FlowId=FlowId, ArtifactName=TargetArtifact)[0].ResultsPath,
                        Labels=find_hostname(ClientId=ClientId)[0].Labels
                     )[0].Stdout AS RecordsProcessed
                  FROM scope()
               }
             )
          }
        )





